name: Release

on:
  push:
    tags: ['v*']

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
        # Allow lint to fail for now (existing lint errors) — remove continue-on-error once fixed
        continue-on-error: true
      - run: npm run compile
      - run: npm run bundle
      - run: npm run test:unit
      - run: npm run pretest
      - run: xvfb-run -a npm test

  release:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx vsce package
      - run: npx vsce publish -p $VSCE_PAT
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: '*.vsix'
          generate_release_notes: true
